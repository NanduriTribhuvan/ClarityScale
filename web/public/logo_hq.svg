<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <!-- Black radial background glow -->
    <radialGradient id="bgGlow" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Diamond clip -->
    <clipPath id="diamondClip">
      <polygon points="500,100 880,480 500,860 120,480"/>
    </clipPath>

    <!-- Left ribbon gradient: cyan → blue → purple -->
    <linearGradient id="ribbonLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="30%" stop-color="#2979ff"/>
      <stop offset="70%" stop-color="#6a1de0"/>
      <stop offset="100%" stop-color="#7c13c8"/>
    </linearGradient>

    <!-- Right ribbon gradient: purple → pink → orange -->
    <linearGradient id="ribbonRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b19d6"/>
      <stop offset="35%" stop-color="#d41fb0"/>
      <stop offset="70%" stop-color="#f0446a"/>
      <stop offset="100%" stop-color="#ff6a00"/>
    </linearGradient>

    <!-- Gloss overlay gradient -->
    <linearGradient id="glossTop" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.25)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.04)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>

    <!-- Left ribbon edge highlight -->
    <linearGradient id="leftEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(160,230,255,0.9)"/>
      <stop offset="100%" stop-color="rgba(160,230,255,0)"/>
    </linearGradient>

    <!-- Right ribbon edge highlight -->
    <linearGradient id="rightEdge" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,160,100,0.8)"/>
      <stop offset="100%" stop-color="rgba(255,160,100,0)"/>
    </linearGradient>

    <!-- Inner shadow for depth -->
    <radialGradient id="innerShadow" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.6)"/>
    </radialGradient>

    <!-- Star sparkle filter -->
    <filter id="starGlow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="2" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Outer glow on diamond border -->
    <filter id="borderGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Bottom reflection gradient -->
    <radialGradient id="reflGrad" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="rgba(200,180,255,0.55)"/>
      <stop offset="100%" stop-color="rgba(200,180,255,0)"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="url(#bgGlow)"/>

  <!-- ============ DIAMOND BORDER (glowing) ============ -->
  <polygon points="500,100 880,480 500,860 120,480"
    fill="none" stroke="url(#ribbonLeft)" stroke-width="2.5" opacity="0.6" filter="url(#borderGlow)"/>
  <polygon points="500,100 880,480 500,860 120,480"
    fill="none" stroke="url(#ribbonRight)" stroke-width="2.5" opacity="0.6" filter="url(#borderGlow)"/>

  <!-- ============ CLIPPED INTERIOR ============ -->
  <g clip-path="url(#diamondClip)">

    <!-- Dark base fill -->
    <polygon points="500,100 880,480 500,860 120,480" fill="#050010"/>

    <!-- ======= LEFT RIBBON (S-curve, blue/cyan) ======= -->
    <!-- Main body -->
    <path d="
      M 205,270
      C 290,210 420,200 460,320
      C 500,440 430,540 370,620
      C 310,700 260,740 230,790
      L 330,800
      C 355,750 410,710 470,640
      C 530,570 605,460 575,330
      C 545,200 410,140 300,160
      L 205,270 Z
    " fill="url(#ribbonLeft)" opacity="0.95"/>

    <!-- Left ribbon gloss highlight strip -->
    <path d="
      M 205,270
      C 255,230 330,210 370,240
      C 330,215 255,235 210,278 Z
    " fill="rgba(180,230,255,0.55)"/>

    <!-- Left ribbon top edge shine -->
    <path d="
      M 210,278
      C 260,225 360,205 415,270
      C 375,200 275,210 218,265 Z
    " fill="rgba(255,255,255,0.35)"/>

    <!-- ======= RIGHT RIBBON (S-curve, purple/pink/orange) ======= -->
    <!-- Main body -->
    <path d="
      M 390,150
      C 460,130 590,160 640,270
      C 690,380 650,480 600,570
      C 550,660 490,720 470,800
      L 580,800
      C 600,720 660,650 710,550
      C 760,450 790,330 740,210
      C 690,90 540,85 430,140
      L 390,150 Z
    " fill="url(#ribbonRight)" opacity="0.95"/>

    <!-- Right ribbon gloss highlight -->
    <path d="
      M 430,140
      C 510,120 620,155 650,240
      C 615,150 510,125 435,148 Z
    " fill="rgba(255,200,240,0.4)"/>

    <!-- Right ribbon top edge shine -->
    <path d="
      M 435,148
      C 520,115 635,150 660,240
      C 630,140 515,118 440,145 Z
    " fill="rgba(255,255,255,0.25)"/>

    <!-- ======= GLOSS OVERLAY ======= -->
    <polygon points="500,100 880,480 500,860 120,480" fill="url(#glossTop)" opacity="0.7"/>

    <!-- Inner depth shadow -->
    <polygon points="500,100 880,480 500,860 120,480" fill="url(#innerShadow)"/>

  </g>

  <!-- ============ DIAMOND OUTER BORDER LINE ============ -->
  <polygon points="500,100 880,480 500,860 120,480"
    fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- ============ TOP STAR SPARKLE ============ -->
  <g filter="url(#starGlow)" transform="translate(500,103)">
    <!-- Bright core -->
    <circle r="5" fill="white"/>
    <!-- Spike cross -->
    <line x1="0" y1="-28" x2="0" y2="28" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
    <line x1="-28" y1="0" x2="28" y2="0" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
    <!-- Diagonal spikes -->
    <line x1="-16" y1="-16" x2="16" y2="16" stroke="white" stroke-width="0.9" stroke-linecap="round" opacity="0.55"/>
    <line x1="16" y1="-16" x2="-16" y2="16" stroke="white" stroke-width="0.9" stroke-linecap="round" opacity="0.55"/>
    <!-- Inner halo -->
    <circle r="10" fill="none" stroke="rgba(200,220,255,0.4)" stroke-width="2"/>
  </g>

  <!-- ============ BOTTOM STAR SPARKLE ============ -->
  <g filter="url(#starGlow)" transform="translate(500,857)">
    <circle r="5" fill="white"/>
    <line x1="0" y1="-26" x2="0" y2="26" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
    <line x1="-26" y1="0" x2="26" y2="0" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
    <line x1="-15" y1="-15" x2="15" y2="15" stroke="white" stroke-width="0.9" stroke-linecap="round" opacity="0.55"/>
    <line x1="15" y1="-15" x2="-15" y2="15" stroke="white" stroke-width="0.9" stroke-linecap="round" opacity="0.55"/>
    <circle r="9" fill="none" stroke="rgba(200,200,255,0.3)" stroke-width="2"/>
  </g>

  <!-- ============ FLOOR REFLECTION ============ -->
  <ellipse cx="500" cy="895" rx="160" ry="18" fill="url(#reflGrad)"/>
  <!-- Secondary softer glow -->
  <ellipse cx="500" cy="895" rx="110" ry="10" fill="rgba(255,255,255,0.18)"/>
  <!-- Center bright dot of reflection -->
  <ellipse cx="500" cy="892" rx="22" ry="4" fill="rgba(255,255,255,0.65)"/>

</svg>
